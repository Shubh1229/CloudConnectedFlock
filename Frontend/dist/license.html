<body>
  <header>
    <span onclick="goHome()">
        <img src="/CCFlock%20Logo.1a6a4fb1.png" alt="Logo">
        Cloud Connected Flock
    </span>
  </header>

  <main>
    <h1>License</h1>
    <pre id="license-text">Loading license...</pre>
  </main>

  <footer>
    <div class="footer-inner">
      <a href="/about.html">About this Website</a> | <a href="/license.html">License</a>
    </div>
  </footer>

  <script>function goHome() {
    const jwt = localStorage.getItem("jwt");
    if (jwt && jwt.split('.').length === 3) window.location.href = "hub.html";
    else window.location.href = "login.html";
}
function checkToken() {
    const token = localStorage.getItem('jwt');
    if (!token) {
        window.location.href = 'login.html';
        return false;
    }
    return true;
}
async function loadLicense() {
    try {
        const response = await fetch('license/License');
        if (!response.ok) {
            document.getElementById('license-text').textContent = 'Failed to load license.';
            return;
        }
        const text = await response.text();
        document.getElementById('license-text').textContent = text;
    } catch (err) {
        document.getElementById('license-text').textContent = 'Error loading license.';
    }
}
window.addEventListener('DOMContentLoaded', loadLicense);

</script>
  <script>async function sendHeartbeat() {
    const token = localStorage.getItem("jwt");
    if (!token || token.split('.').length !== 3) {
        console.warn("JWT missing or malformed. Skipping heartbeat...");
        window.location.href = "login.html";
        return;
    }
    try {
        const response = await fetch("/api/heartbeat", {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + token
            }
        });
        if (!response.ok) {
            console.error("Heartbeat failed with status:", response.status);
            return;
        }
        const result = await response.json();
        console.log("Heartbeat response:", result);
    } catch (err) {
        console.error("Heartbeat failed:", err);
    }
}
sendHeartbeat();
setInterval(sendHeartbeat, 5000);

</script>
