<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Weather Data - CCFlock</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/png" href="logo/CCFlock%20Logo.png">
        <script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>
        <style>
            body {
                margin: 0;
                font-family: Arial, sans-serif;
                background-color: #0b1e3f;
                color: white;
            }
            header {
                display: flex;
                align-items: center;
                background-color: #142b5c;
                padding: 15px;
            }
            header span {
                font-size: 1.2em;
                font-weight: bold;
                cursor: pointer;
                display: flex;
                align-items: center;
            }
            header img {
                height: 24px;
                width: 24px;
                margin-right: 10px;
            }
            h1 {
                text-align: center;
                margin-top: 30px;
                font-size: 36px;
            }
            .controls {
                display: flex;
                justify-content: center;
                margin: 20px 0;
                gap: 10px;
                flex-wrap: wrap;
            }
            .controls input, .controls button {
                padding: 10px;
                font-size: 14px;
            }
            #chartContainer {
                width: 90%;
                margin: auto;
                background-color: #1a1a1a;
                padding: 20px;
                border-radius: 8px;
            }
            footer {
                background-color: #142b5c;
                border-top: 1px solid white;
                width: 100%;
                padding: 15px 0;
                margin-top: 50px;
            }
            .footer-inner {
                max-width: 800px;
                margin: auto;
                text-align: center;
            }
            .footer-inner a {
                color: white;
                text-decoration: underline;
                margin: 0 10px;
            }
        </style>
    </head>
    <body>
        <header>
            <span onclick="window.location.href='hub.html'">
                <img src="logo/CCFlock%20Logo.png" alt="Logo" />
                Cloud Connected Flock
            </span>
        </header>

        <h1>Weather Data Visualization</h1>

        <div class="controls">
            <label>Start:
                <input type="datetime-local" id="start">
            </label>
            <label>End:
                <input type="datetime-local" id="end">
            </label>
            <button onclick="loadData()">Load Data</button>
        </div>

        <div id="chartContainer">
            <div id="tempChart" style="height:600px;"></div>
            <div id="humidityChart" style="height:600px;"></div>
            <div id="pressureChart" style="height:600px;"></div>
        </div>

        <footer>
            <div class="footer-inner">
                <a href="/about.html">About this Website</a> | <a href="/license.html">License</a>
            </div>
        </footer>

        <script>
            async function loadData() {
                const start = document.getElementById('start').value;
                const end = document.getElementById('end').value;

                let url = '/api/data/Data/alldata';
                if (start && end) {
                    url = `/api/data/Data/getdatarange?StartDateTime=${encodeURIComponent(start)}&EndDateTime=${encodeURIComponent(end)}`;
                }

                try {
                    // curl -X 'GET' \
                    // 'http://192.168.1.160:8001/api/data/Data/alldata' \
                    // -H 'accept: */*'

                    const res = await fetch(url, {
                        method: 'GET',
                        headers: {
                            'accept': '*/*'
                        }
                    });
                    const json = await res.json();
                    console.log("RESULT: ", res);
                    console.log("JSON: ", json);

                    const labels = [];
                    const temp = [];
                    const humidity = [];
                    const pressure = [];

                    for (const entry of json.weatherdata) {
                        if (entry.temp > 110 || entry.temp < -30 ||
                            entry.humidity > 100 || entry.humidity < 0 ||
                            entry.pressure < 800 || entry.pressure > 1200) {
                            console.log("Entry Rejected: ", entry);
                            continue;
                        }

                        // const time = new Date(new Date(entry.dateTimeStampID).getTime() - 4 * 60 * 60 * 1000).toISOString();
                        const time = new Date(new Date(entry.dateTimeStampID).getTime() - 4 * 60 * 60 * 1000)
                        .toLocaleString('en-US', {
                            timeZone: 'America/New_York',
                            month: 'short',
                            day: 'numeric',
                            hour: 'numeric',
                            minute: '2-digit',
                            hour12: true
                        });
                        labels.push(new Date(entry.dateTimeStampID).getTime() - 4 * 60 * 60 * 1000);
                        temp.push(entry.temp);
                        humidity.push(entry.humidity);
                        pressure.push(entry.pressure);
                    }

                    Plotly.newPlot('tempChart', [{
                        x: labels,
                        y: temp,
                        type: 'scatter',
                        mode: 'lines+markers',
                        line: { color: 'red' },
                        name: 'Temperature (°F)'
                    }], {
                        title: 'Temperature (°F)',
                        paper_bgcolor: '#1a1a1a',
                        plot_bgcolor: '#1a1a1a',
                        font: { color: 'white' },
                        yaxis: {
                            autorange: false,
                            fixedrange: true,
                            range: [-30,120], // or: range: [20, 30] based on typical values
                            tickfont: { color: 'white' },
                            title: { text: 'Temperature (°F)', font: { color: 'white' } },
                            gridcolor: '#444',
                            gridwidth: '1.5'
                        },
                        xaxis: {
                            type: 'date',
                            tickformat: "%b %d %I:%M %p",  // example: Jun 12 03:45 PM
                            tickfont: { color: 'white' },
                            title: { text: 'Time (EST)', font: { color: 'white' } },
                            tickfont: { color: 'white' },
                            gridcolor: '#444',      // Makes vertical grid lines more visible
                            gridwidth: 1.5
                        }
                    });

                    Plotly.newPlot('humidityChart', [{
                        x: labels,
                        y: humidity,
                        type: 'scatter',
                        mode: 'lines+markers',
                        line: { color: 'blue' },
                        name: 'Humidity (%)'
                    }], {
                        title: 'Humidity (%)',
                        paper_bgcolor: '#1a1a1a',
                        plot_bgcolor: '#1a1a1a',
                        font: { color: 'white' },
                        yaxis: {
                            autorange: false,
                            fixedrange: true,
                            range: [0,100], // or: range: [20, 30] based on typical values
                            tickfont: { color: 'white' },
                            title: { text: '% Humidity', font: { color: 'white' } },
                            gridcolor: '#444',
                            gridwidth: '1.5'
                        },
                        xaxis: {
                            type: 'date',
                            tickformat: "%b %d %I:%M %p",  // example: Jun 12 03:45 PM
                            tickfont: { color: 'white' },
                            title: { text: 'Time (EST)', font: { color: 'white' } },
                            tickfont: { color: 'white' },
                            gridcolor: '#444',      // Makes vertical grid lines more visible
                            gridwidth: 1.5
                        }
                    });

                    Plotly.newPlot('pressureChart', [{
                        x: labels,
                        y: pressure,
                        type: 'scatter',
                        mode: 'lines+markers',
                        line: { color: 'green' },
                        name: 'Pressure (hPa)'
                    }], {
                        title: 'Pressure (hPa)',
                        paper_bgcolor: '#1a1a1a',
                        plot_bgcolor: '#1a1a1a',
                        font: { color: 'white' },
                        yaxis: {
                            autorange: false,
                            fixedrange: true,
                            range: [700,1200], // or: range: [20, 30] based on typical values
                            tickfont: { color: 'white' },
                            title: { text: ' hPa', font: { color: 'white' } },
                            gridcolor: '#444',
                            gridwidth: '1.5'
                        },
                        xaxis: {
                            type: 'date',
                            tickformat: "%b %d %I:%M %p",  // example: Jun 12 03:45 PM
                            tickfont: { color: 'white' },
                            title: { text: 'Time (EST)', font: { color: 'white' } },
                            tickfont: { color: 'white' },
                            gridcolor: '#444',      // Makes vertical grid lines more visible
                            gridwidth: 1.5
                        }
                    });

                } catch (err) {
                    alert("Failed to load data.");
                    console.error(err);
                }
            }

            window.onload = loadData;
        </script>
    </body>
</html>
