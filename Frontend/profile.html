<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Profile - Cloud Connected Flock</title>
  <link rel="icon" href="logo/CCFlock%20Logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background-color: #0b1e3f;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }
    .logo-link {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: white;
      cursor: pointer;
    }
    .logo-link:visited {
      color: white;
    }
    .site-title {
      font-size: 1.2em;
      font-weight: bold;
      letter-spacing: 0.5px;
    }
    header img {
      width: 24px;
      height: 24px;
      margin-right: 10px;
      object-fit: contain;
      vertical-align: middle;
    }


    header {
      display: flex;
      align-items: center;
      background-color: #142b5c;
      padding: 15px;
    }
    .header-links {
      display: flex;
      gap: 20px;
      margin-left: 20px;
    }
    .logout-btn {
      margin-left: auto;
      background-color: #dc3545 !important;
      text-decoration: none;
      border: none;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .logout-btn:hover {
      background-color: #b52a37 !important;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .profile-header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 900px;
      align-items: center;
      margin-bottom: 30px;
      gap: 10px;
    }

    .profile-header h1 {
      margin: 0;
    }

    .button-group {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }
    .action-btn {
      font-size: 1rem;
      font-weight: bold;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: white;
      white-space: nowrap;
      line-height: 1.2;
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 42px;
      background-color: #3c6eec;
      transition: background-color 0.2s ease;
      text-decoration: none !important;
    }
    .action-btn:hover {
      background-color: #345dd1;
    }

    .profile-card {
      background-color: #1c2b4f;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 900px;
    }
    .profile-container {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 40px;
      width: 100%;
      max-width: 900px;
      flex-wrap: nowrap;
    }
    .profile-left {
      width: 200px;
      flex-shrink: 0;
      text-align: center;
    }
    .profile-left img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 50%;
      box-shadow: 0 0 10px black;
    }
    .profile-left h2 {
      margin-top: 15px;
      font-size: 1.4em;
      word-break: break-all;
    }
    .profile-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .bio-block {
      margin-top: 10px;
      margin-bottom: 16px;
      font-size: 1.1em;
      font-style: italic;
      background: #263a6a;
      padding: 14px 18px;
      border-radius: 7px;
      white-space: pre-line;
    }
    .profile-row {
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .profile-row .label {
      font-weight: bold;
      width: 110px;
      min-width: 110px;
      display: inline-block;
      white-space: nowrap;
    }
    .profile-row .value {
      flex: 1;
      word-break: break-all;
    }
    .personal-link a {
      color: #5edfff;
      text-decoration: underline;
      word-break: break-all;
    }
    .personal-link a:hover {
      color: #43b0e9;
    }
    .resume-preview {
      width: 100%;
      height: 320px;
      border: 1px solid #ccc;
      margin-top: 10px;
      background: #222f4b;
      border-radius: 7px;
      display: block;
    }
    .not-uploaded {
      color: #aaa;
      font-style: italic;
      padding: 10px;
    }

    footer {
      background-color: #142b5c;
      padding: 15px 0;
      text-align: center;
      margin-top: auto;
    }
    footer a {
      color: white;
      text-decoration: underline;
      margin: 0 10px;
    }
  </style>
</head>
<body>
  <header>
    <a href="#" id="logoLink" class="logo-link">
      <img src="logo/CCFlock%20Logo.png" alt="Logo" />
      <span class="site-title">Cloud Connected Flock</span>
    </a>
    <button id="logoutButton" class="logout-btn">Logout</button>
  </header>

  <main>
    <div class="profile-header">
      <h1>Profile</h1>
      <div class="button-group" id="editButtonGroup">
        <!-- Buttons will be inserted by JS if permitted -->
      </div>
    </div>
    <div class="profile-card">
      <div class="profile-container">
        <div class="profile-left">
          <img id="profilePic" src="assets/defaultUserPic.jpg" alt="Profile Picture" />
          <h2 id="profileUsername">Username</h2>
        </div>
        <div class="profile-right" id="profileDetails">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>
  </main>

  <footer>
    <a href="about.html">About this Website</a> | <a href="license.html">License</a>
  </footer>

  <script>
    const token = localStorage.getItem("jwt");
    const currentProfile = new URLSearchParams(window.location.search).get("user");
    const loggedInUser = localStorage.getItem("username");
    const defaultPic = "assets/defaultUserPic.jpg";

    async function loadProfile() {
      const res = await fetch("/api/getprofile", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ profilename: currentProfile })
      });

      if (!res.ok) {
        document.getElementById("profileDetails").innerText = "Failed to load profile.";
        return;
      }

      const result = await res.json();
      const profile = result.profile;

      document.getElementById("profileUsername").innerText = profile.username;
      document.getElementById("profilePic").src = profile.profilePicturePath || defaultPic;

      // Combine first and last name
      let fullName = '';
      if (profile.firstName && profile.lastName) {
        fullName = profile.firstName + " " + profile.lastName;
      } else if (profile.firstName) {
        fullName = profile.firstName;
      } else if (profile.lastName) {
        fullName = profile.lastName;
      } else {
        fullName = "Not added";
      }

      // Build personal link (clickable, opens new tab, shows only if present)
      let personalLinkHTML = "Not added";
      if (profile.personalLinks && profile.personalLinks.trim().length > 0) {
        let url = profile.personalLinks.trim();
        if (!/^https?:\/\//i.test(url)) url = "https://" + url;
        personalLinkHTML = `<a href="${url}" class="external-link" target="_blank" rel="noopener noreferrer">${url}</a>`;
      }

      // Bio
      let bioBlock = "";
      if (profile.bio && profile.bio.trim().length > 0) {
        bioBlock = `<div class="bio-block">${profile.bio}</div>`;
      } else {
        bioBlock = `<div class="bio-block not-uploaded">No bio added.</div>`;
      }

      // Resume preview
      let resumeBlock = "";
      if (profile.resumeFilePath && profile.resumeFilePath.length > 0) {
        resumeBlock = `
          <div class="profile-row">
            <span class="label">Resume:</span>
          </div>
          <embed class="resume-preview" src="${profile.resumeFilePath}" type="application/pdf" />
        `;
      } else {
        resumeBlock = `
          <div class="profile-row">
            <span class="label">Resume:</span>
            <span class="not-uploaded">Not uploaded</span>
          </div>
        `;
      }

      // Populate right side
      document.getElementById("profileDetails").innerHTML = `
        <div class="profile-row">
          <span class="label">Name:</span>
          <span class="value">${fullName}</span>
        </div>
        ${bioBlock}
        <div class="profile-row personal-link">
          <span class="label">Personal Link:</span>
          <span class="value">${personalLinkHTML}</span>
        </div>
        ${resumeBlock}
      `;

      // Show edit/change password buttons only if viewing own profile
      if (profile.username === loggedInUser) {
        document.getElementById("editButtonGroup").innerHTML = `
          <button class="action-btn" onclick="goToEdit()">Edit Profile</button>
          <button class="action-btn" onclick="changePassword()">Change Password</button>
        `;
      } else {
        document.getElementById("editButtonGroup").innerHTML = "";
      }
    }

    document.getElementById("logoLink").addEventListener("click", function (e) {
      e.preventDefault();
      const user = localStorage.getItem("username");
      window.location.href = `hub.html?user=${encodeURIComponent(user)}`;
    });

    function goToEdit() {
      const currentProfile = new URLSearchParams(window.location.search).get("user");
      window.location.href = `editprofile.html?user=${encodeURIComponent(currentProfile)}`;
    }
    function changePassword() {
      window.location.href = "resetpassword.html";
    }

    // Logout
    document.getElementById("logoutButton").addEventListener("click", () => {
      localStorage.removeItem("jwt");
      localStorage.removeItem("username");
      window.location.href = "login.html";
    });

    loadProfile();
  </script>
  <script>
    async function sendHeartbeat() {
      const token = localStorage.getItem("jwt");
      if (!token || token.split('.').length !== 3) {
        console.warn("JWT missing or malformed. Skipping heartbeat...");
        window.location.href = "login.html";
        return;
      }

      try {
        const response = await fetch("/api/heartbeat", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + token
          }
        });
        if (!response.ok) {
          console.error("Heartbeat failed with status:", response.status);
          return;
        }
        const result = await response.json();
        //console.log("Heartbeat response:", result);
      } catch (err) {
        console.error("Heartbeat failed:", err);
      }
    }

    sendHeartbeat();
    setInterval(sendHeartbeat, 5000);
  </script>
</body>
</html>
