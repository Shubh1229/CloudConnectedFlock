<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit Profile - Cloud Connected Flock</title>
  <link rel="icon" href="logo/CCFlock%20Logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background-color: #0b1e3f;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      background-color: #142b5c;
      padding: 15px;
    }

    header span {
      font-size: 1.2em;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    header img {
      height: 24px;
      width: 24px;
      margin-right: 10px;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .profile-header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 900px;
      align-items: center;
      margin-bottom: 30px;
    }

    .profile-header h1 {
      margin: 0;
    }

    .profile-card {
      background-color: #1c2b4f;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 900px;
    }

    .profile-container {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 40px;
      width: 100%;
      flex-wrap: nowrap;
    }

    .profile-left {
      width: 200px;
      flex-shrink: 0;
      text-align: center;
    }

    .profile-left img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 50%;
      box-shadow: 0 0 10px black;
    }

    .profile-left h2 {
      margin-top: 15px;
      font-size: 1.4em;
    }

    .profile-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .profile-field {
      margin-bottom: 16px;
    }

    .profile-field label {
      font-weight: bold;
      display: block;
      margin-bottom: 4px;
    }

    .profile-field input, .profile-field textarea {
      width: 100%;
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 1em;
    }

    button#saveButton {
      align-self: flex-start;
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #3c6eec;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    footer {
      background-color: #142b5c;
      padding: 15px 0;
      text-align: center;
      margin-top: auto;
    }

    footer a {
      color: white;
      text-decoration: underline;
      margin: 0 10px;
    }
    .button-group {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .action-btn {
      font-size: 1rem;
      font-weight: bold;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: white;
      white-space: nowrap; /* 🔑 Prevents line wrapping */
      line-height: 1.2;
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 42px; /* 🔑 Force consistent button height */
      background-color: #3c6eec;
      transition: background-color 0.2s ease;
    }

    .action-btn:hover {
      background-color: #345dd1;
    }

    .btn-secondary {
      background-color: #6c757d;
    }

    .btn-secondary:hover {
      background-color: #5a6268;
    }

  </style>
</head>
<body>
  <header>
    <span onclick="goHome()">
      <img src="logo/CCFlock%20Logo.png" alt="Logo" />
      Cloud Connected Flock
    </span>
    <button id="logoutButton" style="margin-left: auto; background-color: #dc3545; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">
      Logout
    </button>
  </header>
  <div id="toast" style="
    visibility: hidden;
    min-width: 250px;
    margin-left: -125px;
    background-color: #333;
    color: #fff;
    text-align: center;
    border-radius: 2px;
    padding: 16px;
    position: fixed;
    z-index: 1000;
    left: 50%;
    bottom: 30px;
    font-size: 17px;
    transition: visibility 0s, opacity 0.5s ease-in-out;
    opacity: 0;
  ">
  </div>

  <main>
    <div class="profile-header">
      <h1>Edit Profile</h1>
    </div>
    <div id="confirmModal" style="
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.6);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    ">
      <div style="
        background-color: #1c2b4f;
        padding: 30px;
        border-radius: 10px;
        text-align: center;
        color: white;
        max-width: 400px;
        margin: auto;
        box-shadow: 0 0 10px black;
      ">
        <p>Are you sure you want to permanently delete your account?</p>
        <div style="margin-top: 20px; display: flex; justify-content: center; gap: 15px;">
          <button id="confirmDelete" class="action-btn" style="background-color: #c0392b;">Delete</button>
          <button id="cancelDelete" class="action-btn" style="background-color: #6c757d;">Cancel</button>
        </div>
      </div>
    </div>


    <div class="profile-card">
      <div class="profile-container">
        <div class="profile-left">
          <img id="profilePic" src="assets/defaultUserPic.jpg" alt="Profile Picture"
                onerror="this.onerror=null; this.src='assets/defaultUserPic.jpg';" />
          <input id="profilePicUpload" type="file" accept="image/*" style="margin-top: 10px;" />
          <h2 id="profileUsername">Username</h2>
        </div>

        <div class="profile-right">
          <div class="profile-field">
            <label for="newUsername">Update Username</label>
            <input id="newUsername" type="text" placeholder="Leave blank to keep current" />
          </div>

          <div class="profile-field">
            <label for="email">Email</label>
            <input id="email" type="email" />
          </div>

          <div class="profile-field">
            <label for="birthday">Birthday</label>
            <input id="birthday" type="date" />
          </div>
          <div class="profile-field">
            <label for="firstName">First Name</label>
            <input id="firstName" type="text" />
          </div>
          <div class="profile-field">
            <label for="lastName">Last Name</label>
            <input id="lastName" type="text" />
          </div>
          <div class="profile-field">
            <label for="bio">Bio</label>
            <textarea id="bio" rows="3"></textarea>
          </div>
          <div class="profile-field">
            <label for="links">Personal Links</label>
            <input id="links" type="text" />
          </div>
          <div class="profile-field">
            <label for="resumeUpload">Upload Resume (PDF)</label>
            <input id="resumeUpload" type="file" accept=".pdf" />
          </div>
          <embed id="resumePreview" src="" type="application/pdf" width="100%" height="400px" style="display:none; border: 1px solid #ccc; margin-top: 10px;" />
          <div class="button-group">
            <button id="saveButton" class="action-btn">Save Changes</button>
            <button id="cancelButton" class="action-btn btn-secondary" type="button">Cancel Changes</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <a href="about.html">About this Website</a> | <a href="license.html">License</a> |
    <button id="deleteAccount" style="background-color: #e63946; color: white; padding: 10px 20px; margin-top: 15px; border: none; border-radius: 5px; cursor: pointer;">
      Delete Account
    </button>
  </footer>

  <script>
    const token = localStorage.getItem("jwt");
    const username = localStorage.getItem("username");
    const defaultPic = "assets/defaultUserPic.jpg";
    let loadedProfile = null;

    async function loadProfile() {
      const res = await fetch("/api/getprofile", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ profilename: username })
      });

      if (!res.ok) {
        alert("Failed to load profile.");
        return;
      }

      const result = await res.json();
      console.log("Results of load profile are ", result);
      const profile = result.profile;
      loadedProfile = profile;
      const picPath = profile.profilePicturePath;
      document.getElementById("profilePic").src = picPath && picPath.trim().length > 0
        ? picPath
        : defaultPic;
      document.getElementById("profileUsername").innerText = profile.username;
      document.getElementById("firstName").value = profile.firstName || "";
      document.getElementById("lastName").value = profile.lastName || "";
      document.getElementById("bio").value = profile.bio || "";
      document.getElementById("links").value = profile.personalLinks || "";
      document.getElementById("email").value = result.email || "";
      document.getElementById("birthday").value = result.birthday || "";
      document.getElementById("newUsername").value = profile.username;
      

      const resumePreview = document.getElementById("resumePreview");
      const resumeUploadLabel = document.querySelector("label[for='resumeUpload']");

      if (profile.resumeFilePath) {
        resumePreview.src = profile.resumeFilePath;
        resumePreview.style.display = "block";
        resumeUploadLabel.textContent = "Update Resume (PDF)";
      } else {
        resumePreview.style.display = "none";
        resumeUploadLabel.textContent = "Upload Resume (PDF)";
      }
    }

    document.getElementById("saveButton").addEventListener("click", async () => {
      if (!loadedProfile) return alert("Profile not loaded yet.");

      let uploadedProfilePicPath = null;
      const profilePicFile = document.getElementById("profilePicUpload").files[0];

      if (profilePicFile) {
        const picForm = new FormData();
        picForm.append("file", profilePicFile);
        const picRes = await fetch("/api/saveasset?type=profilepic", {
          method: "POST",
          headers: {
            Authorization: `Bearer ${token}`
          },
          body: picForm
        });

        const picResult = await picRes.json();
        if (picResult.success) {
          uploadedProfilePicPath = picResult.filepath;
        } else {
          alert("Profile picture upload failed.");
          return;
        }
      }

      let uploadedResumePath = null;
      const resumeFile = document.getElementById("resumeUpload").files[0];

      if (resumeFile) {
        const formData = new FormData();
        formData.append("file", resumeFile);
        const uploadRes = await fetch("/api/saveasset?type=resume", {
          method: "POST",
          headers: {
            Authorization: `Bearer ${token}`
          },
          body: formData
        });

        const uploadResult = await uploadRes.json();
        if (uploadResult.success) {
          uploadedResumePath = uploadResult.filepath;
        } else {
          alert("Resume upload failed.");
          return;
        }
      }


      const payload = {
        username: username,
        newUsername: document.getElementById("newUsername").value || null,
        email: document.getElementById("email").value || "",
        birthday: document.getElementById("birthday").value || "2000-01-01",
        firstName: document.getElementById("firstName").value,
        lastName: document.getElementById("lastName").value,
        bio: document.getElementById("bio").value,
        personalLinks: document.getElementById("links").value,
        resumeFilePath: uploadedResumePath || loadedProfile.resumeFilePath || null,
        profilePicturePath: uploadedProfilePicPath || loadedProfile.profilePicturePath || null,
        updated: true
      };

      const res = await fetch("/api/sendedits", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });

      console.log("send edits response ", res);
      console.log("send edits response " + res);

      if (!res.ok) {
        alert("Failed to save profile.");
        return;
      }

      const result = await res.json();

      console.log("send edits response ", result);
      console.log("send edits response " + result);

      let changedUsername = false;

      if(result.token.length > 0) {
        console.log("new token: " + result.token);
        localStorage.removeItem("jwt");
        localStorage.setItem("jwt", result.token);
        if (!result.AccountInfo) {
          console.warn("Missing AccountInfo in result:", result);
        }
        if (payload.newUsername && payload.newUsername != username) {
          localStorage.setItem("username", payload.newUsername);
          changedUsername = true;
        }
      }

      if (result.success) {
        showToast("Profile updated!");
        setTimeout(() => {
          if (changedUsername) {
            window.location.href = `profile.html?user=${encodeURIComponent(payload.newUsername)}`;
          } else {
            window.location.href = `profile.html?user=${encodeURIComponent(username)}`;
          }
        }, 1500);
      } else {
        alert("Save failed: " + result.message);
      }
    });

    function goHome() {
      window.location.href = `hub.html?user=${encodeURIComponent(username)}`;
    }

    loadProfile();
  </script>
  <script>
    async function sendHeartbeat() {
      const token = localStorage.getItem("jwt");
      if (!token || token.split('.').length !== 3) {
        console.warn("JWT missing or malformed. Skipping heartbeat...");
        window.location.href = "login.html";
        return;
      }

      try {
        const response = await fetch("/api/heartbeat", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + token
          }
        });
        if (!response.ok) {
          console.error("Heartbeat failed with status:", response.status);
          return;
        }
        const result = await response.json();
        //console.log("Heartbeat response:", result);
      } catch (err) {
        console.error("Heartbeat failed:", err);
      }
    }

    sendHeartbeat();

    setInterval(sendHeartbeat, 5000);
  </script>
  <script>
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.innerText = message;
      toast.style.visibility = "visible";
      toast.style.opacity = "1";

      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.visibility = "hidden";
      }, 3000); // Hide after 3 seconds
    }
  </script>
  <script>
    document.getElementById("profilePicUpload").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          document.getElementById("profilePic").src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    });
    document.getElementById("cancelButton").addEventListener("click", () => {
      window.location.href = `profile.html?user=${encodeURIComponent(username)}`;
    });
    document.getElementById("logoutButton").addEventListener("click", () => {
      localStorage.removeItem("jwt");
      localStorage.removeItem("username");
      window.location.href = "login.html";
    });
    const confirmModal = document.getElementById("confirmModal");

    document.getElementById("deleteAccount").addEventListener("click", () => {
      confirmModal.style.display = "flex";
    });

    document.getElementById("cancelDelete").addEventListener("click", () => {
      confirmModal.style.display = "none";
    });

    document.getElementById("confirmDelete").addEventListener("click", async () => {
      const token = localStorage.getItem("jwt");
      const res = await fetch("/api/deleteuser", {
        method: "DELETE",
        headers: { Authorization: `Bearer ${token}` }
      });

      if (res.ok) {
        const result = await res.json();
        if (result.profileStatus && result.accountStatus) {
          localStorage.clear();
          window.location.href = "login.html";
        } else {
          showToast("Account deletion failed.");
        }
      } else {
        showToast("Failed to delete account.");
      }

      confirmModal.style.display = "none";
    });
  </script>
</body>
</html>
