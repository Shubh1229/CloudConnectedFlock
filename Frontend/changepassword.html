<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Change Password - Cloud Connected Flock</title>
  <link rel="icon" href="logo/CCFlock%20Logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      background-color: #0b1e3f;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      background-color: #142b5c;
      padding: 15px;
    }
    .logo-link {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: white;
      cursor: pointer;
    }
    .site-title {
      font-size: 1.2em;
      font-weight: bold;
      letter-spacing: 0.5px;
    }
    header img {
      width: 24px;
      height: 24px;
      margin-right: 10px;
      object-fit: contain;
      vertical-align: middle;
    }
    .logout-btn {
      margin-left: auto;
      background-color: #dc3545 !important;
      text-decoration: none;
      border: none;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .logout-btn:hover {
      background-color: #b52a37 !important;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
    }
    .form-card {
      background-color: #1c2b4f;
      padding: 32px 28px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 30px;
      font-size: 1.4em;
      font-weight: bold;
      text-align: center;
    }
    .form-group {
      width: 100%;
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 9px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 1em;
      margin-bottom: 2px;
    }
    .button-group {
      display: flex;
      gap: 14px;
      margin-top: 10px;
      width: 100%;
      justify-content: flex-end;
    }
    .action-btn {
      font-size: 1rem;
      font-weight: bold;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: white;
      background-color: #3c6eec;
      transition: background-color 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 42px;
    }
    .action-btn:hover {
      background-color: #345dd1;
    }
    .btn-cancel {
      background-color: #6c757d;
    }
    .btn-cancel:hover {
      background-color: #5a6268;
    }
    .toast {
      visibility: hidden;
      min-width: 250px;
      background-color: #333;
      color: #fff;
      text-align: center;
      border-radius: 2px;
      padding: 16px;
      position: fixed;
      z-index: 1000;
      left: 50%;
      bottom: 30px;
      font-size: 17px;
      opacity: 0;
      transform: translateX(-50%);
      transition: opacity 0.5s;
    }
    .toast.show {
      visibility: visible;
      opacity: 1;
    }
    footer {
      background-color: #142b5c;
      padding: 15px 0;
      text-align: center;
      margin-top: auto;
    }
    footer a {
      color: white;
      text-decoration: underline;
      margin: 0 10px;
    }
  </style>
</head>
<body>
  <header>
    <a href="#" id="logoLink" class="logo-link">
      <img src="logo/CCFlock%20Logo.png" alt="Logo" />
      <span class="site-title">Cloud Connected Flock</span>
    </a>
    <button id="logoutButton" class="logout-btn">Logout</button>
  </header>
  <main>
    <form class="form-card" id="changePasswordForm" autocomplete="off">
      <h2>Change Password</h2>
      <div class="form-group">
        <label for="oldPassword">Current Password</label>
        <input type="password" id="oldPassword" name="oldPassword" autocomplete="current-password" required />
      </div>
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" required />
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required />
      </div>
      <div class="button-group">
        <button type="button" class="action-btn btn-cancel" id="cancelBtn">Cancel</button>
        <button type="submit" class="action-btn">Change Password</button>
      </div>
    </form>
    <div id="toast" class="toast"></div>
  </main>
  <footer>
    <a href="about.html">About this Website</a> | <a href="license.html">License</a>
  </footer>
<script>
    // Logo click => Go to Hub
    document.getElementById("logoLink").addEventListener("click", function (e) {
      e.preventDefault();
      const user = localStorage.getItem("username");
      window.location.href = `hub.html?user=${encodeURIComponent(user)}`;
    });

    // Logout button
    document.getElementById("logoutButton").addEventListener("click", () => {
      localStorage.removeItem("jwt");
      localStorage.removeItem("username");
      window.location.href = "login.html";
    });

    // Cancel button
    document.getElementById("cancelBtn").addEventListener("click", () => {
      const user = localStorage.getItem("username");
      window.location.href = `profile.html?user=${encodeURIComponent(user)}`;
    });

    // Toast function
    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.innerText = msg;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 3200);
    }

    // Change password submit
    document.getElementById("changePasswordForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const oldPassword = document.getElementById("oldPassword").value;
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const username = localStorage.getItem("username");

      if (newPassword !== confirmPassword) {
        showToast("New passwords do not match.");
        return;
      }
      if (newPassword.length < 8) {
        showToast("Password must be at least 8 characters.");
        return;
      }

      try {
        const token = localStorage.getItem("jwt");
        const res = await fetch("/api/changepassword", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username: username,
            oldPassword: oldPassword,
            newPassword: newPassword
          })
        });

        if (res.ok) {
          const result = await res.json();
          showToast(result.msg || "Password change response received.");
          if (result.success) {
            setTimeout(() => {
              window.location.href = `profile.html?user=${encodeURIComponent(username)}`;
            }, 1800);
          }
        } else {
          const errorText = await res.text();
          showToast(errorText || "Password change failed.");
        }
      } catch (err) {
        showToast("An error occurred.");
      }
    });
  </script>
  <script>
    // Heartbeat for security/session
    async function sendHeartbeat() {
      const token = localStorage.getItem("jwt");
      if (!token || token.split('.').length !== 3) {
        window.location.href = "login.html";
        return;
      }
      try {
        await fetch("/api/heartbeat", {
          method: "POST",
          headers: { "Authorization": "Bearer " + token }
        });
      } catch (err) {}
    }
    sendHeartbeat();
    setInterval(sendHeartbeat, 5000);
  </script>
</body>
</html>
