<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Private Chat | CCFlock</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body {
        background: #111;
        color: #fff;
        font-family: 'Consolas', monospace;
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        }
        header {
        background: #18181a;
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #333;
        }
        .logo {
        font-size: 1.8rem;
        font-weight: bold;
        color: #9ae34c;
        }
        .logout-btn {
        background: transparent;
        border: 2px solid #ff2d55;
        color: #ff2d55;
        border-radius: 1.5rem;
        padding: 0.4rem 1.2rem;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
        }
        .logout-btn:hover {
        background: #ff2d55;
        color: #fff;
        }
        #chat-box {
        flex: 1;
        overflow-y: auto;
        padding: 1rem 2rem;
        margin: 1rem;
        border-radius: 1rem;
        background: #18181a;
        box-shadow: 0 2px 10px #0005;
        }
        .message {
        margin-bottom: 0.7em;
        word-break: break-word;
        }
        .timestamp {
        color: #c77dff;
        }
        .username {
        color: #2fff2f;
        font-weight: bold;
        margin-left: 0.5rem;
        }
        .msg-content {
        color: #fff;
        margin-left: 0.5rem;
        }
        form {
        display: flex;
        gap: 1rem;
        padding: 0 2rem 1rem;
        }
        #recipient-input,
        #msg-input {
        flex: 1;
        border: none;
        border-radius: 1.5rem;
        padding: 0.7rem 1.2rem;
        font-size: 1rem;
        background: #1d1d22;
        color: #fff;
        box-shadow: 0 1px 5px #0005;
        }
        #send-btn {
        background: #2fff2f;
        color: #222;
        border: none;
        border-radius: 1.5rem;
        padding: 0.7rem 1.8rem;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 1px 8px #0004;
        transition: 0.2s;
        }
        #send-btn:hover {
        background: #25be39;
        color: #fff;
        }
    </style>
    </head>
    <body>
    <header>
        <div class="logo">Private Chat</div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </header>

    <div id="chat-box"></div>

    <form id="chat-form">
        <input id="recipient-input" type="text" placeholder="Recipient username" required />
        <input id="msg-input" type="text" placeholder="Your message" maxlength="500" required />
        <button id="send-btn" type="submit">Send</button>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@latest/dist/browser/signalr.min.js"></script>
    <script>
        const chatBox = document.getElementById('chat-box');
        const form = document.getElementById('chat-form');
        const msgInput = document.getElementById('msg-input');
        const recipientInput = document.getElementById('recipient-input');

        const username = localStorage.getItem("username");
        const token = localStorage.getItem("jwt");

        if (!username || !token) {
        alert("Unauthorized. Please log in first.");
        window.location.href = "login.html";
        }

        function logout() {
        localStorage.clear();
        window.location.href = "login.html";
        }

        function addMessage(user, time, text) {
        const div = document.createElement('div');
        div.classList.add('message');
        div.innerHTML = `
            <span class="timestamp">[${time}]</span>
            <span class="username">[${user}]</span>:
            <span class="msg-content">"${text}"</span>
        `;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function loadHistory() {
        const toWho = recipientInput.value.trim();
        if (!toWho) return;

        chatBox.innerHTML = '';
        const url = `/Privatechat/recentprivate?username=${username}&toWho=${toWho}`;
        const response = await fetch(url);
        if (!response.ok) {
            addMessage("system", "--", "Failed to load chat history.");
            return;
        }
        const messages = await response.json();
        messages.reverse().forEach(msg => {
            const timestamp = msg.dateTime.replace("T", " ").slice(0, 16);
            addMessage(msg.username, timestamp, msg.message);
        });
        }

        const connection = new signalR.HubConnectionBuilder()
        .withUrl("/api/privatechat/hub?username=" + encodeURIComponent(username))
        .configureLogging(signalR.LogLevel.Information)
        .build();

        connection.on("ReceiveMessage", (formatted) => {
        const match = formatted.match(/^\[(.+?)\]\[(.+?)\]: "(.*)"$/);
        if (!match) return;
        const user = match[1];
        const time = match[2];
        const text = match[3];
        addMessage(user, time, text);
        });

        connection.start().catch(err => {
        console.error("SignalR error:", err);
        addMessage("system", "--", "Could not connect to chat server.");
        });

        form.onsubmit = async (e) => {
        e.preventDefault();
        const msg = msgInput.value.trim();
        const toWho = recipientInput.value.trim();
        if (!msg || !toWho) return;

        await connection.invoke("SendMessage", username, msg, toWho)
            .catch(err => console.error("Send error:", err));
        msgInput.value = '';
        };

        recipientInput.addEventListener("change", loadHistory);
    </script>
    <script>
        async function sendHeartbeat() {
        const token = localStorage.getItem("jwt");
        if (!token || token.split('.').length !== 3) {
            console.warn("JWT missing or malformed. Skipping heartbeat...");
            window.location.href = "login.html";
            return;
        }

        try {
            const response = await fetch("/api/heartbeat", {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + token
            }
            });
            if (!response.ok) {
            console.error("Heartbeat failed with status:", response.status);
            return;
            }
            const result = await response.json();
            //console.log("Heartbeat response:", result);
        } catch (err) {
            console.error("Heartbeat failed:", err);
        }
        }

        sendHeartbeat();
        setInterval(sendHeartbeat, 5000);
    </script>
</body>
</html>
